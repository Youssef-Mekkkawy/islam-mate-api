# ── Zakat Calculator Configuration ────────────────────────────────────────────
# Islam Mate API — modules/zakat/module.py
# Routes: GET /api/v1/zakat/calculate  |  GET /api/v1/zakat/nisab

zakat:

  # ── Nisab thresholds ─────────────────────────────────────────────────────────
  nisab:
    gold_grams:   85.0    # 20 mithqal — do NOT change, this is a fixed Islamic value
    silver_grams: 595.0   # 200 dirhams — do NOT change, this is a fixed Islamic value

    # Default nisab standard when caller omits ?nisab_standard=
    # "silver" is preferred by most contemporary scholars (lower threshold, covers more people)
    default_standard: silver

  # ── Zakat rate ───────────────────────────────────────────────────────────────
  rate: 0.025   # 2.5% — fixed by Sharia, do NOT change

  # ── Default spot prices ─────────────────────────────────────────────────────
  # These are used ONLY when the caller does not pass ?gold_price_per_gram= etc.
  # Update these regularly to today's market rates (USD or your preferred currency).
  # For production, consider wiring a price API (e.g. metals-api.com) to keep these live.
  default_prices:
    gold_per_gram:   90.0    # USD — approximate; update daily for accuracy
    silver_per_gram: 0.90    # USD — approximate; update daily for accuracy
    currency:        USD

  # ── Reference ────────────────────────────────────────────────────────────────
  reference:
    book:   "Fiqh al-Zakat"
    author: "Sheikh Yusuf al-Qaradawi"
    note:   >
      Livestock calculations follow the consensus across major Sunni schools
      (Hanafi, Maliki, Shafi'i, Hanbali). For 121+ camels, exact splits vary
      by school — a scholar note is appended in the API response.